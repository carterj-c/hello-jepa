[project]
name = "hello-jepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carter Cameron", email = "ca_camer@live.concordia.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.6.1",
    "hmmlearn>=0.3.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "polars>=1.44.1",
    "scikit-learn>=1.9.0",
    "torch>=2.0.1",
]

[project.scripts]
hello-jepa = "hello_jepa:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.3.1",
]
